<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <style>
      .title{font:700 28px Arial, sans-serif;fill:#111827}
      .box{fill:#ffffff;stroke:#d1d5db;stroke-width:2;rx:12}
      .decision{fill:#fef3c7;stroke:#f59e0b;stroke-width:2}
      .ok{fill:#ecfdf5;stroke:#10b981}
      .err{fill:#fef2f2;stroke:#ef4444}
      .text{font:600 16px Arial, sans-serif;fill:#111827}
      .sub{font:13px Arial, sans-serif;fill:#4b5563}
      .line{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .label{font:13px Arial, sans-serif;fill:#111827}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f9fafb"/>
  <text x="40" y="52" class="title">Luồng mở hoặc tạo direct conversation</text>

  <rect x="50" y="110" width="210" height="74" class="box"/>
  <text x="155" y="141" text-anchor="middle" class="text">Tap friend/message</text>
  <text x="155" y="164" text-anchor="middle" class="sub">contacts_page.dart</text>

  <rect x="330" y="110" width="230" height="74" class="box"/>
  <text x="445" y="141" text-anchor="middle" class="text">Controller.openChat</text>
  <text x="445" y="164" text-anchor="middle" class="sub">contacts/user_search controller</text>

  <rect x="630" y="110" width="250" height="74" class="box"/>
  <text x="755" y="141" text-anchor="middle" class="text">Repository GET</text>
  <text x="755" y="164" text-anchor="middle" class="sub">/conversations/user/{userId}</text>

  <polygon points="1025,95 1165,147 1025,199 885,147" class="decision"/>
  <text x="1025" y="143" text-anchor="middle" class="text">HTTP status?</text>
  <text x="1025" y="166" text-anchor="middle" class="sub">ContactRepository</text>

  <rect x="900" y="285" width="250" height="74" class="box ok"/>
  <text x="1025" y="316" text-anchor="middle" class="text">Parse Conversation</text>
  <text x="1025" y="339" text-anchor="middle" class="sub">conversation.dart</text>

  <rect x="590" y="285" width="250" height="74" class="box"/>
  <text x="715" y="316" text-anchor="middle" class="text">Fallback create</text>
  <text x="715" y="339" text-anchor="middle" class="sub">POST /conversations?userId=...</text>

  <rect x="900" y="470" width="250" height="74" class="box ok"/>
  <text x="1025" y="501" text-anchor="middle" class="text">Go to ChatDetailPage</text>
  <text x="1025" y="524" text-anchor="middle" class="sub">context.go + state.extra</text>

  <rect x="260" y="470" width="250" height="74" class="box err"/>
  <text x="385" y="501" text-anchor="middle" class="text">Show snackbar error</text>
  <text x="385" y="524" text-anchor="middle" class="sub">không fallback nếu không phải 404</text>

  <path d="M260 147 L330 147" class="line"/>
  <path d="M560 147 L630 147" class="line"/>
  <path d="M880 147 L885 147" class="line"/>
  <path d="M1025 199 L1025 285" class="line"/>
  <text x="1046" y="246" class="label">200</text>
  <path d="M930 180 C850 230 790 250 715 285" class="line"/>
  <text x="790" y="244" class="label">404</text>
  <path d="M715 359 C790 410 890 430 1025 470" class="line"/>
  <path d="M1025 359 L1025 470" class="line"/>
  <path d="M930 114 C760 35 500 260 385 470" class="line"/>
  <text x="535" y="298" class="label">lỗi khác</text>
</svg>
