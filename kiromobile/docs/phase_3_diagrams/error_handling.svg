<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <style>
      .title{font:700 28px Arial, sans-serif;fill:#111827}
      .box{fill:#ffffff;stroke:#d1d5db;stroke-width:2;rx:12}
      .decision{fill:#fef3c7;stroke:#f59e0b;stroke-width:2}
      .good{fill:#ecfdf5;stroke:#10b981}
      .bad{fill:#fef2f2;stroke:#ef4444}
      .text{font:600 16px Arial, sans-serif;fill:#111827}
      .sub{font:13px Arial, sans-serif;fill:#4b5563}
      .line{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .label{font:13px Arial, sans-serif;fill:#111827}
    </style>
  </defs>
  <rect width="1280" height="560" fill="#f9fafb"/>
  <text x="40" y="52" class="title">Nguyên tắc xử lý lỗi và giữ nhất quán state</text>

  <rect x="60" y="130" width="200" height="76" class="box"/>
  <text x="160" y="161" text-anchor="middle" class="text">User action</text>
  <text x="160" y="184" text-anchor="middle" class="sub">Add / Cancel / Accept / Reject</text>

  <rect x="330" y="130" width="220" height="76" class="box"/>
  <text x="440" y="161" text-anchor="middle" class="text">Lưu previousState</text>
  <text x="440" y="184" text-anchor="middle" class="sub">controller giữ state cũ</text>

  <rect x="620" y="130" width="220" height="76" class="box"/>
  <text x="730" y="161" text-anchor="middle" class="text">Gọi Repository</text>
  <text x="730" y="184" text-anchor="middle" class="sub">API mutation</text>

  <polygon points="990,106 1130,168 990,230 850,168" class="decision"/>
  <text x="990" y="164" text-anchor="middle" class="text">API success?</text>
  <text x="990" y="187" text-anchor="middle" class="sub">2xx hay lỗi</text>

  <rect x="850" y="335" width="230" height="76" class="good"/>
  <text x="965" y="366" text-anchor="middle" class="text">Update state mới</text>
  <text x="965" y="389" text-anchor="middle" class="sub">status/list được cập nhật</text>

  <rect x="585" y="335" width="230" height="76" class="good"/>
  <text x="700" y="366" text-anchor="middle" class="text">Refresh phụ nếu cần</text>
  <text x="700" y="389" text-anchor="middle" class="sub">Friends / Requests</text>

  <rect x="1060" y="335" width="170" height="76" class="bad"/>
  <text x="1145" y="366" text-anchor="middle" class="text">Giữ state cũ</text>
  <text x="1145" y="389" text-anchor="middle" class="sub">không optimistic sai</text>

  <rect x="1060" y="455" width="170" height="58" class="bad"/>
  <text x="1145" y="481" text-anchor="middle" class="text">SnackBar lỗi</text>
  <text x="1145" y="501" text-anchor="middle" class="sub">actionErrorMessage</text>

  <path d="M260 168 L330 168" class="line"/>
  <path d="M550 168 L620 168" class="line"/>
  <path d="M840 168 L850 168" class="line"/>
  <path d="M965 222 L965 335" class="line"/>
  <text x="982" y="282" class="label">Yes</text>
  <path d="M850 373 L815 373" class="line"/>
  <text x="820" y="356" class="label">optional</text>
  <path d="M1085 206 C1150 260 1145 300 1145 335" class="line"/>
  <text x="1135" y="282" class="label">No</text>
  <path d="M1145 411 L1145 455" class="line"/>
</svg>
