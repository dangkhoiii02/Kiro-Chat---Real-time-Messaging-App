<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <style>
      .title{font:700 28px Arial, sans-serif;fill:#111827}
      .box{fill:#ffffff;stroke:#d1d5db;stroke-width:2;rx:12}
      .primary{fill:#eef2ff;stroke:#6366f1}
      .data{fill:#ecfdf5;stroke:#10b981}
      .api{fill:#fff7ed;stroke:#f97316}
      .text{font:600 16px Arial, sans-serif;fill:#111827}
      .sub{font:13px Arial, sans-serif;fill:#4b5563}
      .line{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="760" fill="#f9fafb"/>
  <text x="40" y="52" class="title">Kiến trúc Phase 3: Contacts + Friend Requests</text>

  <rect x="50" y="120" width="190" height="82" class="box primary"/>
  <text x="145" y="154" text-anchor="middle" class="text">Người dùng</text>
  <text x="145" y="178" text-anchor="middle" class="sub">tap, search, action</text>

  <rect x="315" y="100" width="250" height="122" class="box primary"/>
  <text x="440" y="137" text-anchor="middle" class="text">ContactsPage</text>
  <text x="440" y="161" text-anchor="middle" class="sub">3 tab: Friends, Requests, Search</text>
  <text x="440" y="184" text-anchor="middle" class="sub">contacts_page.dart</text>

  <rect x="650" y="75" width="260" height="76" class="box"/>
  <text x="780" y="106" text-anchor="middle" class="text">ContactsController</text>
  <text x="780" y="130" text-anchor="middle" class="sub">load friends, open chat</text>

  <rect x="650" y="175" width="260" height="76" class="box"/>
  <text x="780" y="206" text-anchor="middle" class="text">FriendRequestsController</text>
  <text x="780" y="230" text-anchor="middle" class="sub">load, accept, reject</text>

  <rect x="650" y="275" width="260" height="76" class="box"/>
  <text x="780" y="306" text-anchor="middle" class="text">UserSearchController</text>
  <text x="780" y="330" text-anchor="middle" class="sub">search, send, cancel, open chat</text>

  <rect x="1010" y="175" width="220" height="96" class="box api"/>
  <text x="1120" y="211" text-anchor="middle" class="text">ContactRepository</text>
  <text x="1120" y="235" text-anchor="middle" class="sub">Dio API contract</text>
  <text x="1120" y="258" text-anchor="middle" class="sub">contact_repository.dart</text>

  <rect x="1010" y="355" width="220" height="82" class="box api"/>
  <text x="1120" y="389" text-anchor="middle" class="text">Backend API</text>
  <text x="1120" y="413" text-anchor="middle" class="sub">friends, search, requests</text>

  <rect x="650" y="470" width="260" height="112" class="box data"/>
  <text x="780" y="505" text-anchor="middle" class="text">Contact Models</text>
  <text x="780" y="529" text-anchor="middle" class="sub">ContactProfile, Friend</text>
  <text x="780" y="552" text-anchor="middle" class="sub">ContactRequest, FriendshipStatus</text>

  <rect x="315" y="470" width="250" height="102" class="box"/>
  <text x="440" y="506" text-anchor="middle" class="text">GoRouter</text>
  <text x="440" y="530" text-anchor="middle" class="sub">/app/contacts</text>
  <text x="440" y="553" text-anchor="middle" class="sub">/app/chats/:conversationId</text>

  <rect x="50" y="470" width="190" height="102" class="box"/>
  <text x="145" y="506" text-anchor="middle" class="text">ChatDetailPage</text>
  <text x="145" y="530" text-anchor="middle" class="sub">nhận Conversation</text>
  <text x="145" y="553" text-anchor="middle" class="sub">qua state.extra</text>

  <path d="M240 161 L315 161" class="line"/>
  <path d="M565 137 L650 113" class="line"/>
  <path d="M565 161 L650 213" class="line"/>
  <path d="M565 185 L650 313" class="line"/>
  <path d="M910 113 L1010 205" class="line"/>
  <path d="M910 213 L1010 223" class="line"/>
  <path d="M910 313 L1010 242" class="line"/>
  <path d="M1120 271 L1120 355" class="line"/>
  <path d="M1010 396 L910 526" class="line"/>
  <path d="M650 526 L565 526" class="line"/>
  <path d="M315 521 L240 521" class="line"/>
  <path d="M440 470 L440 222" class="line"/>
</svg>
