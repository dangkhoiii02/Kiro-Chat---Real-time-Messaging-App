<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <style>
      .title{font:700 28px Arial, sans-serif;fill:#111827}
      .state{fill:#ffffff;stroke:#d1d5db;stroke-width:2;rx:14}
      .active{fill:#eef2ff;stroke:#6366f1}
      .good{fill:#ecfdf5;stroke:#10b981}
      .disabled{fill:#f3f4f6;stroke:#9ca3af}
      .text{font:700 16px Arial, sans-serif;fill:#111827}
      .sub{font:13px Arial, sans-serif;fill:#4b5563}
      .line{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .label{font:13px Arial, sans-serif;fill:#111827}
    </style>
  </defs>
  <rect width="1280" height="700" fill="#f9fafb"/>
  <text x="40" y="52" class="title">State machine của FriendshipStatus</text>

  <rect x="70" y="150" width="210" height="82" class="state active"/>
  <text x="175" y="184" text-anchor="middle" class="text">not_connected</text>
  <text x="175" y="208" text-anchor="middle" class="sub">UI: Add</text>

  <rect x="70" y="300" width="210" height="82" class="state active"/>
  <text x="175" y="334" text-anchor="middle" class="text">not_determined</text>
  <text x="175" y="358" text-anchor="middle" class="sub">UI: Add</text>

  <rect x="390" y="220" width="240" height="82" class="state"/>
  <text x="510" y="254" text-anchor="middle" class="text">friend_request_sent</text>
  <text x="510" y="278" text-anchor="middle" class="sub">UI: Pending / Cancel</text>

  <rect x="390" y="420" width="240" height="82" class="state"/>
  <text x="510" y="454" text-anchor="middle" class="text">friend_request_received</text>
  <text x="510" y="478" text-anchor="middle" class="sub">UI: Accept / Reject</text>

  <rect x="770" y="220" width="190" height="82" class="state good"/>
  <text x="865" y="254" text-anchor="middle" class="text">friends</text>
  <text x="865" y="278" text-anchor="middle" class="sub">UI: Message</text>

  <rect x="1040" y="135" width="170" height="70" class="state disabled"/>
  <text x="1125" y="165" text-anchor="middle" class="text">blocked</text>
  <text x="1125" y="187" text-anchor="middle" class="sub">disabled</text>

  <rect x="1040" y="245" width="170" height="70" class="state disabled"/>
  <text x="1125" y="275" text-anchor="middle" class="text">blocked_by</text>
  <text x="1125" y="297" text-anchor="middle" class="sub">disabled</text>

  <rect x="1040" y="355" width="170" height="70" class="state disabled"/>
  <text x="1125" y="385" text-anchor="middle" class="text">unknown</text>
  <text x="1125" y="407" text-anchor="middle" class="sub">disabled</text>

  <rect x="770" y="420" width="190" height="82" class="state good"/>
  <text x="865" y="454" text-anchor="middle" class="text">Chat</text>
  <text x="865" y="478" text-anchor="middle" class="sub">open conversation</text>

  <path d="M280 191 C320 205 350 225 390 247" class="line"/>
  <text x="300" y="185" class="label">send request</text>
  <path d="M280 341 C320 320 350 295 390 276" class="line"/>
  <text x="300" y="335" class="label">send request</text>
  <path d="M390 260 C345 260 325 205 280 191" class="line"/>
  <text x="315" y="265" class="label">cancel</text>
  <path d="M630 461 L770 275" class="line"/>
  <text x="655" y="360" class="label">accept</text>
  <path d="M390 461 C260 490 170 440 175 382" class="line"/>
  <text x="245" y="492" class="label">reject</text>
  <path d="M865 302 L865 420" class="line"/>
  <text x="883" y="365" class="label">message</text>
</svg>
